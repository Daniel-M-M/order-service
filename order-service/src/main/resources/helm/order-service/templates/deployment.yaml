apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "order-service.fullname" . }}
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "order-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "order-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "order-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $k, $v := $.Values.config.databases}}
            - name: {{ $k | upper }}_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "A secretName is required!" $v.secrets.name }}
                  key: {{ required "A url is required!" $v.secrets.url }}
            - name: {{ $k | upper }}_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "A secretName is required!" $v.secrets.name }}
                  key: {{ required "A user is required!" $v.secrets.user }}
            - name: {{ $k | upper }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "A secretName is required!" $v.secrets.name }}
                  key: {{ required "A key is required!" $v.secrets.password }}
            {{- end }}
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "A secretName is required!" .Values.config.keycloak.secrets.name }}
                  key: {{ required "A user is required!" .Values.config.keycloak.external.url }}
            - name: KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: {{ required "A secretName is required!" .Values.config.keycloak.secrets.name }}
                  key: {{ required "A user is required!" .Values.config.keycloak.external.realm }}
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "A secretName is required!" .Values.config.keycloak.secrets.name }}
                  key: {{ required "A user is required!" .Values.config.keycloak.external.clientId }}
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: {{ required "A secretName is required!" .Values.config.keycloak.secrets.name }}
                  key: {{ required "A user is required!" .Values.config.keycloak.external.issuer }}
            - name: SWAGGER_OAUTH2_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "A secretName is required!" .Values.config.keycloak.secrets.name }}
                  key: {{ required "A user is required!" .Values.config.keycloak.external.redirectUri }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
