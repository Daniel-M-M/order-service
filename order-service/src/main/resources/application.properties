spring.application.name=order-service

server.port=3000

# Postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:example}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Logging
logging.structured.format.console=ecs
logging.level.org.springframework.security=INFO

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:/resources/db/migration
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5434/postgres}
spring.flyway.user=${DB_USER:postgres}
spring.flyway.password=${DB_PASSWORD:example}
spring.flyway.schemas=postgres

# Actuator - ENDPOINTS WEB CONFIGURATION
management.endpoints.web.exposure.include=info, health, metrics

management.endpoints.enabled-by-default=false
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true
management.endpoint.metrics.enabled=true

# Actuator - HEALTH ENDPOINT
# best practice 'when_authorized' per health
management.endpoint.health.show-details=when_authorized

# Actuator - INFO ENDPOINT CONFIGURATION
management.info.env.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# Keycloak Configuration
# Server Resources
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/foodmanager}

# SpringDoc Configuration
springdoc.swagger-ui.url=/properties-swagger.yaml
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Swagger-UI
springdoc.swagger-ui.oauth.client-id=${CLIENT_ID:foodmanager}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid profile email read_access write_access
springdoc.swagger-ui.oauth2-redirect-url=${SWAGGER_OAUTH2_REDIRECT_URL:http://localhost:3000/swagger-ui/oauth2-redirect.html}
springdoc.swagger-ui.persist-authorization=true

# Spring Web
spring.web.resources.static-locations=file:/config/openapi/,classpath:/static/
