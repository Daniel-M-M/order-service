spring.application.name=order-service

# postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:example}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.root=INFO
logging.level.io.fabric8=DEBUG

# Keycloak
keycloak.auth-server-url=http://localhost:8080
keycloak.jwk-set-uri=http://localhost:8080/realms/foodmanager/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/foodmanager
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/foodmanager